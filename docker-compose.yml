version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_jsonb_demo
    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - postgres_network

networks:
  postgres_network:
    driver: bridge